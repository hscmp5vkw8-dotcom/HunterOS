function checkURL(value) {

}
function checkProduct(v, imported=false) {

  const p={id:checkedText(v.id,100),brand:checkedText(v.brand,80),model:checkedText(v.model,100),variant:checkedText(v.variant??'',140),name:checkedText(v.name,140),category:one(v.category,CATEGORIES),kind:checkedText(v.kind??'Gear',80),sourceURL:checkURL(v.sourceURL),checkedAt:checkedText(v.checkedAt??'',10),weightGrams:num(v.weightGrams??null,0,1000000,true),weightLabel:checkedText(v.weightLabel??'Weight not verified',180),priceUSD:num(v.priceUSD??null,0,10000000,true),priceNote:checkedText(v.priceNote??'Check source before purchasing.',500),note:checkedText(v.note??'',1600),sku:checkedText(v.sku??'',100),carry:one(v.carry??'packed',['packed','worn','consumable']),tags:[],reviewStatus:imported?'imported':(v.reviewStatus==='reviewed'?'reviewed':'imported'),purchaseURL:v.purchaseURL?checkURL(v.purchaseURL):'',purchaseLabel:checkedText(v.purchaseLabel??'',80),retailerURL:v.retailerURL?checkURL(v.retailerURL):'',retailerLabel:checkedText(v.retailerLabel??'',80)};

function allProducts(){const m=new Map(STARTER_CATALOG.map(p=>[p.id,p]));for(const p of data.catalog||[])m.set(p.id,p);return [...m.values()];}

function normalized(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/×/g,'x').replace(/\./g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function productMatches(p,q){
  if(/^https:\/\//i.test(q.trim())){try{const a=new URL(q.trim()),b=new URL(p.sourceURL);return a.hostname.replace(/^www\./,'')===b.hostname.replace(/^www\./,'')&&a.pathname.replace(/\/$/,'')===b.pathname.replace(/\/$/,'');}catch{return false}}

  return normalized(q).split(/\s+/).filter(Boolean).every(t=>hay.includes(t));

}
function recCard(d,h){const p=getProduct(recChosen(d)),existing=recExisting(h,d),lockerItem=!existing?recLocker(d):null,checked=recIsChecked(h,d),imported=p.reviewStatus!=='reviewed';const why=imported?'This catalog entry was imported and has not been independently reviewed. Confirm the linked configuration and facts before using it.':REC_WHY[p.id]||'A starting choice to review against your existing gear and hunt requirements.';
 return `<article class="rec-card ${existing?'kept':''}" data-rec-card="${esc(d.key)}"><div class="rec-card-top"><span class="eyebrow">${esc(d.label)}</span><span class="rec-status ${existing?'kept':''}">${existing?'EXISTING · KEPT':lockerItem?'CHECK YOUR LOCKER':d.optional?'OPTIONAL EXTRA':imported?'IMPORTED · REVIEW':'STARTER PICK'}</span></div><div class="rec-brand">${esc(p.brand)}</div><h3>${esc(p.model)}</h3><p class="rec-variant">${esc(p.variant||'Choose your fit, size and color')}</p><p class="rec-why"><b>Why I’d consider it.</b> ${esc(why)}</p>${d.ids.length>1?`<label class="rec-field-label" for="rec-option-${d.key}">Compare an alternative</label><select id="rec-option-${d.key}" data-rec-choice="${d.key}" ${existing?'disabled':''}>${d.ids.map(id=>{const v=getProduct(id);return `<option value="${esc(id)}" ${p.id===id?'selected':''}>${esc(v.name)}</option>`}).join('')}</select>`:''}<div class="product-numbers"><div><span>Published weight reference</span><strong>${p.weightGrams===null?'Not verified':esc(p.weightLabel)}</strong></div><div><span>Reference price · not live</span><strong>${p.priceUSD===null?'Exact price not verified':p.priceUSD.toLocaleString('en-US',{style:'currency',currency:'USD'})}</strong></div></div><details><summary>Fit, configuration & what’s missing</summary><p>${esc(d.review)}</p><p>${esc(p.note)}</p><p>${esc(p.priceNote)} Source ${imported?'date supplied':'reviewed'}: ${esc(p.checkedAt||'not supplied')}.</p>${sourceLink(p)}</details>${existing?`<div class="rec-existing">This need is already represented:<strong>${esc(existing.name)}</strong>Kept unchanged. This is not an assessment of whether it is suitable.<br><button class="btn ghost compact" data-action="rec-edit-existing" data-id="${esc(existing.id)}">Review your existing entry</button></div>`:lockerItem?`<div class="rec-existing">Found equipment in your locker:<strong>${esc(lockerItem.name)}</strong>Review suitability before buying another.<br><button class="btn secondary compact" data-action="rec-use-owned" data-slot="${d.key}" data-id="${esc(lockerItem.id)}">Review & use owned gear</button></div>`:''}<div class="rec-addline"><label class="check-label"><input type="checkbox" data-rec-check="${d.key}" ${checked?'checked':''} ${existing?'disabled':''}>${existing?'Existing entry protected':lockerItem?'Plan a different item':'Include in review'}</label>${sourceLink(p,'Source')}</div>${d.key==='pack'?'<p class="rec-small-note">Complete-pack references include a frame. Existing pack components are never replaced automatically.</p>':''}${p.weightGrams===null?'<p class="rec-small-note">Unknown weight stays blank. It is not counted as a known zero.</p>':''}</article>`;
}
function recCards(){const h=recContext(),slots=recSlots(h);return ['The daily system','Weather protection','Glassing & camp','Water, light & cooking'].map(group=>{const a=slots.filter(d=>d.section===group);return a.length?`<div class="rec-heading"><div><h2>${group}</h2><p class="muted">${group==='Weather protection'?'Layer roles are separate. More pieces are not automatically better.':'Editorial starting choices, not a required shopping list.'}</p></div></div><div class="rec-grid">${a.map(d=>recCard(d,h)).join('')}</div>`:''}).join('');}
function recCommit(){const n=recSelections().length;return `<div class="rec-commit"><p><strong>${n} ${n===1?'choice':'choices'} selected</strong>Review all changes before anything is saved.</p><button class="btn" data-action="rec-review" ${n?'':'disabled'}>Review selections ${icon('arrow',16)}</button></div>`;}
function recRefreshSummary(){const el=document.querySelector('#rec-summary'),foot=document.querySelector('#rec-commit');if(el)el.innerHTML=recSummary();if(foot)foot.innerHTML=recCommit();}
function recommendedView(){const h=recContext(),saved=!!h.id;return heading('SELECT / REVIEW / MAKE IT YOURS','Recommended gear.','Real starting choices. Your existing equipment comes first.',`<div class="rec-header-actions"><button class="btn ghost compact" data-action="nav" data-view="catalog">${icon('catalog',14)}All gear</button></div>`)+`<section class="rec-banner"><div><span class="badge">HUNTEROS / FIELD KIT STARTERS</span><h2>A system, not a shopping spree.</h2><p>Compare real gear, keep what you own, and review before adding. Research-based candidates—not field-tested rankings or a safety assessment.</p></div><div class="rec-emblem">${icon('hunts',32)}<strong>BUILD</strong><span>YOUR SYSTEM</span></div></section><div class="rec-context"><label>Plan suggestions for<select id="rec-hunt"><option value="" ${saved?'':'selected'}>Sample: Colorado archery elk · not yet saved</option>${data.hunts.map(v=>`<option value="${esc(v.id)}" ${v.id===h.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label><label>Optics starting preference<select id="rec-mode"><option value="premium" ${recMode==='premium'?'selected':''}>Premium focus · Maven B1.2 10×42</option><option value="value" ${recMode==='value'?'selected':''}>Spend selectively · Maven C.1 8×42</option></select></label><p class="rec-context-note">This changes the default binocular selection, not the entire kit’s price tier. Choose individual alternatives below. Apparel starts with men’s reference pages; it is not sized to any user.</p></div><div class="rec-context-tags"><span>${esc(h.state)} · ${esc(h.species)}</span><span>${h.days} days · ${esc(h.style)}</span><span>${h.low}–${h.high}°F entered assumptions</span><span>${h.elevation.toLocaleString()} ft entered elevation</span><span>${saved?'SAVED HUNT':'SAMPLE ONLY'}</span></div>${h.low<=20?'<div class="note warn"><b>Cold-weather review required.</b> This starter deliberately withholds sleep, tent and stove selections at entered lows of 20°F or below. That is a conservative prototype boundary, not a product rating or evidence that any system is safe above it. Your existing items are untouched. Review a complete cold-weather system with a qualified outfitter or equipment specialist.</div>':''}${h.style==='Day Hunt'?'<div class="note">Day-hunt mode: overnight tent, sleeping bag, pad and stove are not proposed here. Your emergency-shelter and contingency requirements still remain.</div>':''}${['Base Camp','Horseback'].includes(h.style)?'<div class="note">Camp-supplied gear may already cover sleep and cooking. Those products are optional and unchecked here; confirm what your camp or outfitter provides.</div>':''}<div id="rec-summary">${recSummary()}</div><div class="rec-heading"><div><h2>Choose your starting gear</h2><p class="muted">Selected does not mean owned, purchased, packed or suitable.</p></div><div class="actions"><button class="btn ghost compact" data-action="rec-clear">Clear choices</button><button class="btn secondary compact" data-action="rec-reset">Reset picks</button></div></div><div id="rec-cards">${recCards()}</div><div class="rec-heading"><div><h2>The important things a product list cannot decide</h2><p class="muted">These stay in your checklist for a human decision.</p></div></div><div class="rec-manual"><div><h3>Fit, warmth & conditions</h3><p>Boot fit, socks, spare layers and stationary insulation. Pack belt/torso fit. Shelter conditions and correct sleep-system sizing. No apparel temperature limits or personal comfort guarantees are calculated.</p></div><div><h3>Food, water & emergency planning</h3><p>Food and water quantities, treatment limits, first-aid contents, communications, navigation backups, field-care and retrieval plans. A filled checklist is not certification that the hunt is safe or complete.</p></div></div><p class="rec-saved-notice">Small, curated catalog—not a search of every product on the market. Exact prices or weights that could not be verified remain blank. Source links are ordinary manufacturer links, with no affiliate tracking or connected checkout. Refreshed catalog data cannot silently rewrite your saved gear.</p><div id="rec-commit">${recCommit()}</div>`;}
function recMakeProduct(p,d){return checkItem({id:uid(),name:p.name,category:p.category,grams:p.weightGrams,price:p.priceUSD,quantity:1,carry:d.carry,owned:false,packed:false,brand:p.brand,model:p.model,variant:p.variant,note:`HunterOS starter candidate — review fit and conditions. ${d.review}`,recSlot:d.key,source:p,weightOrigin:p.weightGrams===null?'unknown':'catalog',priceOrigin:p.priceUSD===null?'unknown':'catalog'});}
function recBuildPlan(h,selections){
 const before=h.items,items=JSON.parse(JSON.stringify(before)),kept=[],unsupported=[];
 for(const choice of selections){const config=REC_CONFIG[choice.key];if(!config)throw Error('Unknown recommendation group.');const d={...config,key:choice.key};const allowed=recSlots(h).some(x=>x.key===d.key);if(!allowed){unsupported.push(d.label);continue;}
 const existing=recExisting({...h,items},d);if(existing){kept.push(existing.name);continue;}
 let next;if(choice.lockerId){const owned=data.gear.find(x=>x.id===choice.lockerId);if(!owned||!recMatches(owned,d))throw Error('The owned gear entry could not be matched.');next=checkItem({...owned,id:uid(),owned:true,packed:false,recSlot:d.key});}else{const p=getProduct(choice.productId);if(!p||!d.ids.includes(p.id))throw Error('The selected product is no longer available in this candidate set.');next=recMakeProduct(p,d);}
 const index=items.findIndex(x=>recUntouched(x,d));if(index>=0){next.id=items[index].id;items[index]=next;}else items.push(next);
 for(const [name,category,carry] of d.extras||[]){if(!items.some(x=>x.name===name))items.push(checkItem(item(name,category,carry)));}
 }
 const originals=new Map(before.map(i=>[i.id,i]));const changes=items.filter(i=>!originals.has(i.id)||JSON.stringify(i)!==JSON.stringify(originals.get(i.id))).map(i=>({item:i,old:originals.get(i.id)||null}));
 return {items,kept,unsupported,changes};
}
function recReview(selections=recSelections()){
 if(!selections.length){toast('Choose at least one product to review.');return;}
 const context=recContext(),sample=!context.id;const h=sample?{...REC_SAMPLE,id:uid(),items:generate(REC_SAMPLE)}:context;
 try{const plan=recBuildPlan(h,selections);pendingRecommendation={huntId:sample?'':h.id,hunt:sample?h:null,before:JSON.stringify(h.items),plan};
 if(!plan.changes.length){toast('Your existing entries already represent these selections. Nothing was changed.');return;}
 const n=plan.changes.filter(c=>c.item.source||c.item.recSlot).length,helpers=plan.changes.length-n;
 modal('Review your selections.',`${esc(h.name)} · ${sample?'creates a clearly labeled sample hunt':'updates this hunt only'}`,`<div class="note"><b>${n} gear entries</b> and <b>${helpers} accessory / follow-up lines</b> will be added or filled in. Only untouched generic placeholders can be replaced. Entered weights, prices, owned gear and other custom entries are protected.</div><div class="rec-review">${plan.changes.map(c=>`<div class="rec-review-line ${!c.item.source&&!c.item.recSlot?'helper-line':''}"><span>${c.old?'FILL UNTOUCHED PLACEHOLDER':c.item.source||c.item.recSlot?'ADD GEAR':'KEEP THE REMAINING REQUIREMENT VISIBLE'}</span><strong>${esc(c.item.name)}</strong>${c.old?`<p>Replaces: ${esc(c.old.name)}</p>`:''}<p>${c.item.owned?'Owned locker copy · ':'Not marked owned · '}${c.item.grams===null?'Weight unknown':exactWeight(c.item.grams)} · ${c.item.price===null?'Price unknown':c.item.price.toLocaleString('en-US',{style:'currency',currency:'USD'})}${c.item.source?' · dated source reference':''}</p></div>`).join('')}</div>${plan.kept.length?`<div class="note">Existing entries kept: ${plan.kept.map(esc).join('; ')}.</div>`:''}<div class="note warn">Product sizes, frame fit and weather suitability are still unconfirmed. No purchase is made. Blank prices and accessory weights mean the total is incomplete. Generic follow-up lines are review tasks, not verified zero-weight items.</div>`,`<button class="btn ghost" type="button" data-action="rec-cancel">Back to choices</button><button class="btn" type="button" data-action="rec-apply">${sample?'Create sample & add choices':'Add to this loadout'} ${icon('check',16)}</button>`);
 }catch(e){toast('Could not prepare selections: '+e.message);}
}
function recApply(){const pending=pendingRecommendation;if(!pending)return;let h=pending.hunt||data.hunts.find(x=>x.id===pending.huntId);if(!h||JSON.stringify(h.items)!==pending.before){pendingRecommendation=null;closeModal();toast('The loadout changed. Please review the selections again.');render();return;}
 const original=JSON.parse(JSON.stringify(h.items));h.items=pending.plan.items;if(pending.hunt)data.hunts.unshift(h);activeHunt=h.id;recHuntId=h.id;pendingRecommendation=null;save();closeModal();go('loadout');toast('Selections added. Existing gear was kept; review unknown weights, prices and fit.');
 // Immediate undo only restores this operation if its result is still unchanged.
 lastRecUndo={huntId:h.id,before:original,after:JSON.stringify(h.items)};const main=document.querySelector('#main');main.insertAdjacentHTML('afterbegin','<div class="note" id="rec-applied-note">Recommended selections added for review. <button class="btn ghost compact rec-undo" data-action="rec-undo">Undo these additions</button></div>');
}
let lastRecUndo=null;
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='rec-open')recOpen(el.dataset.id);
 if(a==='rec-clear'){const st=recState();for(const d of recSlots(recContext()))st.checks[d.key]=false;render();}
 if(a==='rec-reset'){delete recMemory[(recContext().id||'sample')+'|'+recMode];render();}
 if(a==='rec-review')recReview();
 if(a==='rec-cancel'){pendingRecommendation=null;closeModal();}
 if(a==='rec-apply')recApply();
 if(a==='rec-use-owned')recReview([{key:el.dataset.slot,lockerId:el.dataset.id}]);
 if(a==='rec-edit-existing'){const h=recContext();if(h.id){activeHunt=h.id;gearEditor('hunt',el.dataset.id);}}
 if(a==='rec-undo'){const u=lastRecUndo,h=u&&data.hunts.find(x=>x.id===u.huntId);if(!h||JSON.stringify(h.items)!==u.after){toast('Other changes were made. Use the item editor or a backup rather than undoing them.');return;}h.items=u.before;lastRecUndo=null;save();render();toast('Recommendation additions undone. Previous entries restored.');}
});
document.addEventListener('change',ev=>{const e=ev.target;if(e.id==='rec-hunt'){recHuntId=e.value;render();}
 if(e.id==='rec-mode'){recMode=e.value==='value'?'value':'premium';render();}
 if(e.dataset.recChoice){recState().choices[e.dataset.recChoice]=e.value;document.querySelector('#rec-cards').innerHTML=recCards();recRefreshSummary();}
 if(e.dataset.recCheck){recState().checks[e.dataset.recCheck]=e.checked;recRefreshSummary();}
});

document.querySelector('#export-icon').innerHTML=icon('download',15);document.querySelector('#import-icon').innerHTML=icon('upload',15);render();
</script></body></html>
