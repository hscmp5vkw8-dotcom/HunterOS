name: HunterOS mobile checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml', 'Indexv1.0.html']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml', 'Indexv1.0.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npx expo export --platform all --max-workers 2
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Save check outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunteros-mobile-checks
          path: |
            mobile/test-results/
            mobile/dist/
            mobile/package-lock.json
          retention-days: 7
