name: HunterOS mobile checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml', 'Indexv1.0.html']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml', 'Indexv1.0.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:edge
      - run: npx expo install --check
      - run: npx expo export --platform all --max-workers 2
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Export synthetic account preview
        run: npx expo export --platform web --output-dir dist-profile-test --max-workers 2 --clear
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_SUPABASE_URL: 'https://hunteros-test.invalid'
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
      - name: Verify synthetic service is present in the test bundle
        run: >-
          node -e "const fs=require('node:fs');const dir='dist-profile-test/_expo/static/js/web';const files=fs.readdirSync(dir).filter(f=>f.endsWith('.js'));if(!files.some(f=>fs.readFileSync(dir+'/'+f,'utf8').includes('https://hunteros-test.invalid')))throw Error('Synthetic backend missing from account test bundle');"
      - run: npm run test:profile:web
      - run: npm run test:messages:web
        env:
          HUNTEROS_TEST_WEB_ROOT: 'dist-profile-test'
      - run: npm run test:feedback:web
        env:
          HUNTEROS_FEEDBACK_WEB_ROOT: 'dist-profile-test'
      - name: Save check outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunteros-mobile-checks
          path: |
            mobile/test-results/
            mobile/dist/
            mobile/package-lock.json
          retention-days: 7
